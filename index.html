<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="TAO / BTC / sats / USD / EUR ↔ AUD converter. Crypto via CoinGecko, fiat via Frankfurter (ECB).">
<title>TAO · BTC · AUD Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='%2322d3ee'%3Eτ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1220; --card:#121a2b; --line:#1e2a44; --text:#e8eefc; --muted:#8b9bb8;
  --tao:#22d3ee; --btc:#f7931a; --fiat:#a78bfa; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --w:min(100vw, 380px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
body{display:flex;justify-content:center;padding:12px 10px 28px}
.app{width:var(--w);display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:.02em}
.badge{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.78rem;padding:9px 2px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"].tao{background:rgba(34,211,238,.14);color:var(--tao)}
.tab[aria-selected="true"].btc,.tab[aria-selected="true"].sats{background:rgba(247,147,26,.14);color:var(--btc)}
.tab[aria-selected="true"].usd,.tab[aria-selected="true"].eur{background:rgba(167,139,250,.16);color:var(--fiat)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.accent-tao{color:var(--tao)}.accent-btc{color:var(--btc)}.accent-fiat{color:var(--fiat)}
.row{display:flex;gap:8px;align-items:center}
input[type="text"]{width:100%;background:#0a101c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px 12px;font-size:1.25rem;font-weight:650;outline:none}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.unit{min-width:42px;text-align:right;font-weight:700;color:var(--muted);font-size:.9rem}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch.hidden{display:none}
.switch label{font-size:.9rem}
.toggle{position:relative;width:46px;height:28px;flex:0 0 auto}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#243149;border-radius:999px;cursor:pointer;transition:.15s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#cbd5e1;border-radius:50%;transition:.15s}
.toggle input:checked + .slider{background:rgba(52,211,153,.35)}
.toggle input:checked + .slider:before{transform:translateX(18px);background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{appearance:none;border:1px solid var(--line);background:#0a101c;color:var(--text);border-radius:999px;padding:8px 10px;font-size:.78rem;font-weight:650;cursor:pointer}
.chip.goal{border-color:rgba(52,211,153,.4);color:var(--good)}
.meta{display:grid;gap:6px;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--text);font-weight:650}
.rate{font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}
button.btn{flex:1;appearance:none;border:1px solid var(--line);background:#0a101c;color:var(--text);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
button.btn.primary{background:linear-gradient(180deg,#1d4ed8,#1e40af);border-color:#1e3a8a}
.status{min-height:1.35em;font-size:.76rem;color:var(--muted);white-space:pre-line}
.status.ok{color:var(--good)}.status.warn{color:var(--warn)}.status.err{color:var(--bad)}
.foot{font-size:.7rem;color:#6b7a96;text-align:center;line-height:1.35}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.plan.hidden{display:none}
.plan .box{background:#0a101c;border:1px solid var(--line);border-radius:12px;padding:10px}
.plan .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.plan .v{font-size:.95rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>TAO · BTC · Fiat → AUD</h1>
    <span class="badge">β live</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Asset">
    <button class="tab tao" role="tab" aria-selected="true" data-asset="tao">TAO</button>
    <button class="tab btc" role="tab" aria-selected="false" data-asset="btc">BTC</button>
    <button class="tab sats" role="tab" aria-selected="false" data-asset="sats">Sats</button>
    <button class="tab usd" role="tab" aria-selected="false" data-asset="usd">USD</button>
    <button class="tab eur" role="tab" aria-selected="false" data-asset="eur">EUR</button>
  </nav>

  <section class="card">
    <div class="label"><span id="tokenLabel" class="accent-tao">Amount (TAO)</span><span id="tokenHint">1 TAO</span></div>
    <div class="row">
      <input id="tokenIn" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Asset amount" value="1">
      <div class="unit" id="tokenUnit">τ</div>
    </div>
  </section>

  <section class="card">
    <div class="label"><span>Amount (AUD)</span><span>A$</span></div>
    <div class="row">
      <input id="audIn" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="AUD amount" value="">
      <div class="unit">A$</div>
    </div>
    <div class="chips">
      <button type="button" class="chip" data-aud="25">A$25</button>
      <button type="button" class="chip" data-aud="100">A$100</button>
      <button type="button" class="chip goal" data-aud="3000">A$3,000</button>
      <button type="button" class="chip goal" data-plan="daily">/day · 30d</button>
      <button type="button" class="chip goal" data-plan="weekly">/week</button>
    </div>
  </section>

  <section class="card switch" id="taxRow">
    <label for="taxToggle">24% tax reserve (TAO rewards)</label>
    <div class="toggle">
      <input id="taxToggle" type="checkbox" aria-label="Apply 24% tax reserve">
      <span class="slider" onclick="document.getElementById('taxToggle').click()"></span>
    </div>
  </section>

  <section class="card">
    <div class="meta">
      <div class="rate">1 <span id="rateAsset">TAO</span> = <b id="rateAud">—</b> A$</div>
      <div class="rate" id="crossRateRow">1 TAO = <b id="rateTaoBtc">—</b> BTC</div>
      <div id="grossNetRow">Gross ↔ Net: <b id="grossNet">—</b></div>
      <div>Crypto: <b id="srcCrypto">—</b> · Fiat: <b id="srcFiat">—</b></div>
    </div>
    <div class="plan" id="planRow">
      <div class="box"><div class="k">Daily for A$3k/mo</div><div class="v" id="dailyNeed">—</div></div>
      <div class="box"><div class="k">Weekly for A$3k/mo</div><div class="v" id="weeklyNeed">—</div></div>
    </div>
  </section>

  <div class="actions">
    <button type="button" class="btn primary" id="refreshBtn">Refresh rates</button>
    <button type="button" class="btn" id="swapBtn">Flip</button>
  </div>
  <div class="status" id="status">Loading rates…</div>
  <p class="foot">Crypto: CoinGecko · Fiat: Frankfurter (ECB daily) · 1 BTC = 100,000,000 sats · no wallets · indicative only</p>
</main>
<script>
(function(){
  const FALLBACK = {
    taoAud: 326.13,
    btcAud: 114344,
    taoBtc: 326.13 / 114344,
    eurAud: 1.77,
    usdAud: 1.52
  };
  const SATS_PER_BTC = 100000000;
  const TAX = 0.24;
  const KEY = 'tao-btc-aud-calc-v2';
  const CG = 'https://api.coingecko.com/api/v3/simple/price?ids=bittensor,bitcoin&vs_currencies=aud,btc';
  const FF = 'https://api.frankfurter.dev/v1/latest?from=EUR&to=AUD,USD';

  const el = {
    tokenIn: document.getElementById('tokenIn'),
    audIn: document.getElementById('audIn'),
    tax: document.getElementById('taxToggle'),
    taxRow: document.getElementById('taxRow'),
    status: document.getElementById('status'),
    rateAud: document.getElementById('rateAud'),
    rateTaoBtc: document.getElementById('rateTaoBtc'),
    rateAsset: document.getElementById('rateAsset'),
    tokenLabel: document.getElementById('tokenLabel'),
    tokenHint: document.getElementById('tokenHint'),
    tokenUnit: document.getElementById('tokenUnit'),
    cross: document.getElementById('crossRateRow'),
    grossNet: document.getElementById('grossNet'),
    grossNetRow: document.getElementById('grossNetRow'),
    dailyNeed: document.getElementById('dailyNeed'),
    weeklyNeed: document.getElementById('weeklyNeed'),
    planRow: document.getElementById('planRow'),
    srcCrypto: document.getElementById('srcCrypto'),
    srcFiat: document.getElementById('srcFiat'),
    refresh: document.getElementById('refreshBtn'),
    swap: document.getElementById('swapBtn'),
  };

  let asset = 'tao';
  let lastEdited = 'token';
  let rates = Object.assign({}, FALLBACK, {
    cryptoAt: null, fiatAt: null,
    cryptoSrc: 'Cached reference', fiatSrc: 'Cached reference'
  });
  let updating = false;

  function clampNum(n){
    if (!Number.isFinite(n)) return NaN;
    if (n < 0) return 0;
    if (n > 1e15) return 1e15;
    return n;
  }
  function parseAmt(s){
    const t = String(s == null ? '' : s).replace(/,/g,'').trim();
    if (!t || t === '.' || t === '-') return NaN;
    return clampNum(Number(t));
  }
  function fmt(n, digits){
    if (!Number.isFinite(n)) return '—';
    const d = digits == null ? (Math.abs(n) >= 1000 ? 2 : Math.abs(n) >= 1 ? 4 : 8) : digits;
    return n.toLocaleString('en-AU', { maximumFractionDigits: d, minimumFractionDigits: 0 });
  }
  function fmtAud(n){
    return Number.isFinite(n) ? 'A$' + n.toLocaleString('en-AU',{maximumFractionDigits:2,minimumFractionDigits:2}) : '—';
  }
  function isCrypto(){ return asset === 'tao' || asset === 'btc' || asset === 'sats'; }
  function taxApplies(){ return asset === 'tao' && el.tax.checked; }
  function unitRate(){
    if (asset === 'tao') return rates.taoAud;
    if (asset === 'btc') return rates.btcAud;
    if (asset === 'sats') return rates.btcAud / SATS_PER_BTC;
    if (asset === 'usd') return rates.usdAud;
    return rates.eurAud;
  }
  function assetLabel(){
    return ({tao:'TAO',btc:'BTC',sats:'sats',usd:'USD',eur:'EUR'})[asset];
  }
  function setStatus(msg, kind){
    el.status.textContent = msg;
    el.status.className = 'status' + (kind ? ' ' + kind : '');
  }
  function tokenToAudGross(tok){ return tok * unitRate(); }
  function audGrossToToken(aud){ const r = unitRate(); return r > 0 ? aud / r : NaN; }

  function syncFromLast(){
    if (updating) return;
    updating = true;
    try {
      if (lastEdited === 'token'){
        const tok = parseAmt(el.tokenIn.value);
        if (!Number.isFinite(tok)) el.audIn.value = '';
        else {
          const gross = tokenToAudGross(tok);
          const shown = taxApplies() ? gross * (1 - TAX) : gross;
          el.audIn.value = Number.isFinite(shown) ? String(+shown.toFixed(2)) : '';
        }
      } else {
        const audShown = parseAmt(el.audIn.value);
        if (!Number.isFinite(audShown)) el.tokenIn.value = '';
        else {
          const gross = taxApplies() ? audShown / (1 - TAX) : audShown;
          const tok = audGrossToToken(gross);
          const digits = asset === 'sats' ? 0 : asset === 'btc' ? 8 : (asset === 'tao' ? 6 : 4);
          el.tokenIn.value = Number.isFinite(tok) ? String(+tok.toFixed(digits)) : '';
        }
      }
      updateMeta();
      persist();
    } finally { updating = false; }
  }

  function updateMeta(){
    const label = assetLabel();
    el.rateAsset.textContent = label;
    el.rateAud.textContent = fmt(unitRate(), asset === 'sats' ? 8 : 4);
    el.rateTaoBtc.textContent = fmt(rates.taoBtc, 8);
    el.cross.style.display = asset === 'tao' ? '' : 'none';
    el.taxRow.classList.toggle('hidden', asset !== 'tao');
    el.planRow.classList.toggle('hidden', asset !== 'tao');
    el.grossNetRow.style.display = asset === 'tao' ? '' : 'none';

    const tok = parseAmt(el.tokenIn.value);
    if (asset === 'tao' && Number.isFinite(tok)){
      const gross = tokenToAudGross(tok);
      const net = gross * (1 - TAX);
      el.grossNet.textContent = taxApplies()
        ? fmtAud(gross) + ' gross → ' + fmtAud(net) + ' net'
        : fmtAud(gross) + ' (tax off)';
    } else el.grossNet.textContent = '—';

    if (asset === 'tao'){
      const monthGoal = 3000;
      const dailyAud = monthGoal / 30;
      const weeklyAud = monthGoal / (365.25 / 52);
      const needD = taxApplies() ? dailyAud / (1 - TAX) : dailyAud;
      const needW = taxApplies() ? weeklyAud / (1 - TAX) : weeklyAud;
      el.dailyNeed.textContent = fmt(audGrossToToken(needD), 4) + ' TAO';
      el.weeklyNeed.textContent = fmt(audGrossToToken(needW), 4) + ' TAO';
    }

    el.srcCrypto.textContent = rates.cryptoSrc + (rates.cryptoAt ? ' @ ' + new Date(rates.cryptoAt).toLocaleTimeString('en-AU') : '');
    el.srcFiat.textContent = rates.fiatSrc + (rates.fiatAt ? ' @ ' + new Date(rates.fiatAt).toLocaleDateString('en-AU') : '');

    const accent = asset === 'tao' ? 'accent-tao' : (isCrypto() ? 'accent-btc' : 'accent-fiat');
    el.tokenLabel.className = accent;
    el.tokenLabel.textContent = 'Amount (' + label + ')';
    el.tokenUnit.textContent = ({tao:'τ',btc:'₿',sats:'sats',usd:'$',eur:'€'})[asset];
    el.tokenHint.textContent = asset === 'sats' ? '100,000,000 sats = 1 BTC' : ('1 ' + label);
  }

  function setAsset(next){
    asset = next;
    document.querySelectorAll('.tab').forEach(t => {
      t.setAttribute('aria-selected', t.dataset.asset === asset ? 'true' : 'false');
    });
    if (Number.isFinite(parseAmt(el.audIn.value))) lastEdited = 'aud';
    syncFromLast();
  }

  async function fetchCrypto(){
    try {
      const res = await fetch(CG, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const taoAud = Number(j?.bittensor?.aud);
      const btcAud = Number(j?.bitcoin?.aud);
      let taoBtc = Number(j?.bittensor?.btc);
      if (!Number.isFinite(taoBtc) && Number.isFinite(taoAud) && Number.isFinite(btcAud) && btcAud > 0)
        taoBtc = taoAud / btcAud;
      if (!Number.isFinite(taoAud) || !Number.isFinite(btcAud)) throw new Error('Bad crypto payload');
      rates.taoAud = taoAud;
      rates.btcAud = btcAud;
      rates.taoBtc = taoBtc;
      rates.cryptoAt = Date.now();
      rates.cryptoSrc = 'CoinGecko live';
      return true;
    } catch (e) {
      if (!rates.cryptoAt) {
        rates.taoAud = FALLBACK.taoAud;
        rates.btcAud = FALLBACK.btcAud;
        rates.taoBtc = FALLBACK.taoBtc;
        rates.cryptoSrc = 'Cached reference';
      } else {
        rates.cryptoSrc = 'CoinGecko cached';
      }
      return false;
    }
  }

  async function fetchFiat(){
    try {
      const res = await fetch(FF, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const eurAud = Number(j?.rates?.AUD);
      const eurUsd = Number(j?.rates?.USD);
      if (!Number.isFinite(eurAud) || !Number.isFinite(eurUsd) || eurUsd <= 0) throw new Error('Bad fiat payload');
      rates.eurAud = eurAud;
      rates.usdAud = eurAud / eurUsd; // cross via EUR
      rates.fiatAt = j.date ? Date.parse(j.date + 'T12:00:00Z') : Date.now();
      rates.fiatSrc = 'Frankfurter/ECB ' + (j.date || '');
      return true;
    } catch (e) {
      if (!rates.fiatAt) {
        rates.eurAud = FALLBACK.eurAud;
        rates.usdAud = FALLBACK.usdAud;
        rates.fiatSrc = 'Cached reference';
      } else {
        rates.fiatSrc = 'Frankfurter cached';
      }
      return false;
    }
  }

  async function fetchRates(){
    setStatus('Fetching CoinGecko + Frankfurter…');
    const [okC, okF] = await Promise.all([fetchCrypto(), fetchFiat()]);
    syncFromLast();
    if (okC && okF) setStatus('Rates updated · crypto + fiat live', 'ok');
    else if (okC || okF) setStatus('Partial update · ' + (okC ? 'crypto live' : 'crypto cached') + ' · ' + (okF ? 'fiat live' : 'fiat cached'), 'warn');
    else setStatus('Offline — Cached reference (TAO A$' + fmt(rates.taoAud,2) + ', BTC A$' + fmt(rates.btcAud,0) + ')', 'warn');
    persist();
  }

  function persist(){
    try {
      localStorage.setItem(KEY, JSON.stringify({
        asset, lastEdited,
        token: el.tokenIn.value, aud: el.audIn.value,
        tax: el.tax.checked, rates
      }));
    } catch(_){}
  }
  function restore(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.rates && Number.isFinite(s.rates.taoAud) && Number.isFinite(s.rates.btcAud)) {
        rates = Object.assign({}, rates, s.rates);
      }
      if (['tao','btc','sats','usd','eur'].includes(s.asset)) asset = s.asset;
      if (s.lastEdited === 'token' || s.lastEdited === 'aud') lastEdited = s.lastEdited;
      if (typeof s.token === 'string') el.tokenIn.value = s.token;
      if (typeof s.aud === 'string') el.audIn.value = s.aud;
      if (typeof s.tax === 'boolean') el.tax.checked = s.tax;
      document.querySelectorAll('.tab').forEach(t => {
        t.setAttribute('aria-selected', t.dataset.asset === asset ? 'true' : 'false');
      });
    } catch(_){}
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setAsset(t.dataset.asset)));
  el.tokenIn.addEventListener('input', () => { lastEdited = 'token'; syncFromLast(); });
  el.audIn.addEventListener('input', () => { lastEdited = 'aud'; syncFromLast(); });
  el.tax.addEventListener('change', () => { syncFromLast(); });
  el.refresh.addEventListener('click', () => fetchRates());
  el.swap.addEventListener('click', () => { lastEdited = lastEdited === 'token' ? 'aud' : 'token'; syncFromLast(); });
  document.querySelectorAll('.chip[data-aud]').forEach(b => b.addEventListener('click', () => {
    el.audIn.value = b.dataset.aud; lastEdited = 'aud'; syncFromLast();
  }));
  document.querySelectorAll('.chip[data-plan]').forEach(b => b.addEventListener('click', () => {
    setAsset('tao');
    const month = 3000;
    const aud = b.dataset.plan === 'daily' ? month / 30 : month / (365.25 / 52);
    el.audIn.value = String(+aud.toFixed(2));
    lastEdited = 'aud';
    syncFromLast();
  }));
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'r' || e.key === 'R') fetchRates();
    if (e.key === '1') setAsset('tao');
    if (e.key === '2') setAsset('btc');
    if (e.key === '3') setAsset('sats');
    if (e.key === '4') setAsset('usd');
    if (e.key === '5') setAsset('eur');
    if ((e.key === 't' || e.key === 'T') && asset === 'tao') { el.tax.checked = !el.tax.checked; syncFromLast(); }
  });

  restore();
  syncFromLast();
  fetchRates();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
